name: Request Reviewers

# Trigger whenever a PR is opened, reopened, or updated (new commits pushed).
# This workflow only REQUESTS reviewers — it does NOT approve or merge.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip if the PR itself was opened by the bot/Dependabot to avoid noise.
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Request reviewers
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewers = ['rsemeah'];

            // Exclude the PR author from the reviewer list to avoid GitHub API errors.
            const author = context.payload.pull_request.user.login;
            const eligible = reviewers.filter(r => r !== author);

            if (eligible.length === 0) {
              core.info('No eligible reviewers to request (author is the only reviewer).');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: eligible,
            });

            core.info(`Review requested from: ${eligible.join(', ')}`);

      - name: Log review request
        run: |
          echo "✅ Review request sent for PR #${{ github.event.pull_request.number }}"
          echo "   Branch: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"
